name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    
    continue-on-error: ${{ matrix.python-version == '3.14' }} # Ignores warning in emd site package 
    
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run tests
        run: uv run --only-group dev tox -e py

      - name: Lint dependencies with deptry
        if: matrix.python-version == '3.13'
        run: uv run --only-group dev deptry .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set up Python 3.13
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ruff check
        run: uv run --only-group dev ruff check .
