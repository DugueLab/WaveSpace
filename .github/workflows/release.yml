name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m pip install --upgrade twine && twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  docs-build:
    name: Build documentation
    uses: ./.github/workflows/docs-build.yml

  publish:
    name: Publish to PyPI
    needs: [build, docs-build]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/wavespace

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    name: Activate and build Read the Docs
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Activate tagged version on Read the Docs
        env:
          RTD_TOKEN: ${{ secrets.RTD_API_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          curl --fail-with-body --silent --show-error -X PATCH \
            -H "Authorization: Token ${RTD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"active": true, "hidden": false}' \
            https://app.readthedocs.org/api/v3/projects/wavespace/versions/${TAG}/

      - name: Trigger Read the Docs build
        env:
          RTD_TOKEN: ${{ secrets.RTD_API_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Token ${RTD_TOKEN}" \
            https://app.readthedocs.org/api/v3/projects/wavespace/versions/${TAG}/builds/