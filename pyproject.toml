[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "WaveSpace"
version = "1.1.8"
description = "A Python package for the analysis of cortical traveling waves"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Kirsten Petras", email = "kirsten.petras@u-paris.fr" }
]
requires-python = ">=3.9"
keywords = [
    "neuroscience",
    "traveling-waves",
    "MEG",
    "EEG",
    "cortex",
    "neural-oscillations",
]
classifiers = [
    "Development Status :: 4 - beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "plotly",
    "pint",
    "pyvista",
    "pandas",
    "scikit-learn",
    "scikit-image",
    "tvb-gdist",
    "emd",
    "mne",
]

[project.urls]
Homepage = "https://github.com/kpetras/WaveSpace"
Repository = "https://github.com/kpetras/WaveSpace"
Issues = "https://github.com/kpetras/WaveSpace/issues"
Documentation = "https://wavespace.readthedocs.io"

[dependency-groups]
test = []
dev = [
    "tox",
    "tox-uv",
]

[tool.setuptools.packages.find]
include = ["WaveSpace*"]