[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "WaveSpace"
version = "1.1.8"
description = "A Python package for the analysis of cortical traveling waves"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Kirsten Petras" },
    { name = "Dennis Croonenberg" },
    { name = "Laura Dugué" },
]
requires-python = ">=3.9"
keywords = [
    "neuroscience",
    "traveling-waves",
    "MEG",
    "EEG",
    "cortex",
    "neural-oscillations",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [    
    "numpy>=2.0.2",
    "matplotlib",
    "scipy",
    "plotly",
    "pint",
    "pyvista",
    "pandas",
    "scikit-learn",
    "scikit-image",
    "tvb-gdist",
    "emd",
    "mne",
]

[project.urls]
Homepage = "https://github.com/kpetras/WaveSpace"
Repository = "https://github.com/kpetras/WaveSpace"
Issues = "https://github.com/kpetras/WaveSpace/issues"
Documentation = "https://wavespace.readthedocs.io"

[project.optional-dependencies]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
]

[dependency-groups]
dev = [
    "tox",
    "tox-uv",
    "sphinx",
    "pydata-sphinx-theme",
]

[tool.setuptools.packages.find]
include = ["WaveSpace*"]
