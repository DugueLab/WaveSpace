[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "WaveSpace"
version = "1.1.9"
description = "A Python package for the analysis of cortical traveling waves"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Kirsten Petras" },
    { name = "Dennis Croonenberg" },
    { name = "Laura Dugué" },
]
requires-python = ">=3.9"
keywords = [
    "neuroscience",
    "traveling-waves",
    "MEG",
    "EEG",
    "cortex",
    "neural-oscillations",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [    
    "numpy>=2.0.2",
    "matplotlib",
    "scipy",
    "plotly",
    "pint",
    "pyvista",
    "pandas",
    "scikit-learn",
    "scikit-image",
    "tvb-gdist",
    "emd",
    "mne",
    "joblib",
    "vtk",
]

[project.urls]
Homepage = "https://github.com/kpetras/WaveSpace"
Repository = "https://github.com/kpetras/WaveSpace"
Issues = "https://github.com/kpetras/WaveSpace/issues"
Documentation = "https://wavespace.readthedocs.io"

[dependency-groups]
dev = [
    "ruff",
    "tox",
    "tox-uv",
    "pytest>=8.4.2",
    "deptry",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-gallery",
]

[tool.setuptools.packages.find]
include = ["WaveSpace*"]

[tool.deptry]
ignore = ["DEP002"]

[tool.deptry.package_module_name_map]
matplotlib = ["matplotlib", "mpl_toolkits"]
tvb-gdist = "gdist"
scikit-learn = "sklearn"
scikit-image = "skimage"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = [    
    "N999",    # invalid-module-name
    "TRY002",  # raise-vanilla-class
    "BLE001",  # blind-except
]

[tool.ruff.lint.isort]
known-first-party = ["WaveSpace"]